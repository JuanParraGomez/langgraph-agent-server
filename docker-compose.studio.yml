# LangGraph Studio – parallel server (port 8123)
# This compose file adds the Studio-compatible agent server alongside 8070.
# Run with: docker compose -f docker-compose.yml -f docker-compose.studio.yml up -d
#
# 8070 (langgraph-agent-server) is NOT defined here so it can never be modified.
# Only the new service is declared here.

services:
  langgraph-studio-server:
    build:
      context: .
      dockerfile: Dockerfile.studio
    container_name: langgraph-studio-server
    ports:
      - "8123:8123"
    env_file:
      - /home/juan/.config/langsmith/langsmith.env
    environment:
      AGENT_DATA_DIR: /app/data
      GLOBAL_ENV_PATH: /host_global.env
      # Keep Studio traces under a distinct LangSmith project
      LANGSMITH_PROJECT: langgraph-agent-server-studio
      LANGSMITH_STUDIO_PROJECT: langgraph-agent-server-studio
      # Backend services (same as 8070)
      TERMINAL_TOOLS_BASE_URL: http://host.docker.internal:8090
      TERMINAL_TOOLS_MCP_URL: http://host.docker.internal:8091/mcp/
      RAG_SERVER_BASE_URL: http://host.docker.internal:8000
      RAG_SERVER_MCP_URL: http://host.docker.internal:8081
      CELERY_SERVER_BASE_URL: http://host.docker.internal:8011
      CELERY_SERVER_MCP_URL: http://host.docker.internal:8082/mcp
      HAPI_BASE_URL: http://host.docker.internal:8095
      HAPI_MCP_URL: http://host.docker.internal:8096/mcp/
      VOICE_PAIR_BASE_URL: http://host.docker.internal:8085
      RAG_DEFAULT_TENANT_ID: tenant-stack-probe
      BACKEND_TIMEOUT_SECONDS: "20"
    volumes:
      - ./data:/app/data
      - /home/juan/Documents/.env:/host_global.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
