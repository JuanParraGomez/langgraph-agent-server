<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Shot Agent Demo</title>
  <style>
    :root {
      --bg: #f4efe6;
      --card: #fffaf2;
      --ink: #1f1a17;
      --line: #d8cbb8;
      --accent: #a2512b;
    }
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: linear-gradient(180deg, #f7f1e8 0%, #eadfce 100%);
      color: var(--ink);
    }
    main {
      max-width: 760px;
      margin: 48px auto;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(31, 26, 23, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
    }
    code {
      background: #efe3d2;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Archivo temporal para pruebas</h1>
      <p>Este HTML existe solo para validar flujos de procesamiento, lectura y descarte.</p>
      <p>Archivo relacionado: <code>demo_agent.py</code></p>
      <p>Ubicacion: <code>langgraph-agent-server/data/trash/one_shot_agent_demo/</code></p>
      <span class="badge">Desechable</span>
    </section>
  </main>
</body>
</html>
